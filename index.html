<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正版查询系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Noto Sans SC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>正版查询系统</h1>
            <p class="text-muted">请输入产品序列号进行真伪验证</p>
        </header>

        <div class="search-container">
            <div class="input-group">
                <input type="text" id="snInput" class="form-control" placeholder="请输入序列号 (例如: MOB-20260409-ABCD)">
                <button class="btn btn-search" type="button" onclick="queryProduct()">查询</button>
            </div>
        </div>

        <div id="loading" class="text-center mb-4" style="display: none;">
            <div class="spinner-border text-dark" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
        </div>

        <div id="resultCard" class="result-card">
            <div class="row align-items-center">
                <div class="col-md-5 text-center mb-4 mb-md-0">
                    <img id="pImg" src="" alt="产品图片" class="product-img">
                </div>
                <div class="col-md-7">
                    <div class="status-badge">验证通过：正版产品</div>
                    <div class="row">
                        <div class="col-6">
                            <div class="info-label">产品名称</div>
                            <div id="pName" class="info-value">-</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">产品型号</div>
                            <div id="pModel" class="info-value">-</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">产品类型</div>
                            <div id="pType" class="info-value">-</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">销售渠道</div>
                            <div id="pSalesChannel" class="info-value">-</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">序列号</div>
                            <div id="pSn" class="info-value">-</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">查询次数</div>
                            <div id="pQueryCount" class="info-value">-</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">SN 码 (物理标签)</div>
                            <div id="pSnCode" class="info-value">-</div>
                        </div>
                        <div class="col-12">
                            <div class="info-label">电子手册</div>
                            <div id="pManual" class="info-value">
                                <a id="pManualLink" href="#" target="_blank" class="btn btn-sm btn-outline-dark">点击查看电子手册</a>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="info-label">备注说明</div>
                            <div id="pRemarks" class="info-value">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="errorMsg" class="alert alert-danger text-center mx-auto" style="max-width: 600px; display: none; border-radius: 15px;">
            您输入的序列号不正确或非正品
        </div>
    </div>

    <footer class="footer">
        <div id="footerCopyright">&copy; 2026 正版查询中心. 保留所有权利.</div>
        <div id="footerBeian"></div>
    </footer>

    <!-- Bootstrap 5 JS & Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
